apiVersion: v1
kind: Secret
metadata:
  name: assetro-secrets
  namespace: assetro-platform
  labels:
    app.kubernetes.io/name: assetro-platform
    app.kubernetes.io/part-of: assetro
type: Opaque
# IMPORTANT: Replace placeholder values before applying to any environment.
# In production, use a secrets manager (AWS Secrets Manager, HashiCorp Vault,
# or Kubernetes External Secrets Operator) instead of static Secret manifests.
#
# Values must be base64-encoded. Generate with: echo -n 'value' | base64
stringData:
  # -- Database ------------------------------------------------------------------
  DATABASE_USER: "CHANGE_ME"
  DATABASE_PASSWORD: "CHANGE_ME"

  # -- MongoDB -------------------------------------------------------------------
  MONGODB_USERNAME: "CHANGE_ME"
  MONGODB_PASSWORD: "CHANGE_ME"

  # -- Redis ---------------------------------------------------------------------
  REDIS_PASSWORD: "CHANGE_ME"

  # -- RabbitMQ ------------------------------------------------------------------
  RABBITMQ_USER: "CHANGE_ME"
  RABBITMQ_PASSWORD: "CHANGE_ME"

  # -- JWT -----------------------------------------------------------------------
  JWT_ACCESS_SECRET: "CHANGE_ME"
  JWT_REFRESH_SECRET: "CHANGE_ME"

  # -- Stripe --------------------------------------------------------------------
  STRIPE_SECRET_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"

  # -- AWS -----------------------------------------------------------------------
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"

  # -- Blockchain ----------------------------------------------------------------
  DEPLOYER_PRIVATE_KEY: "CHANGE_ME"

  # -- Super Admin ---------------------------------------------------------------
  SUPER_ADMIN_INITIAL_PASSWORD: "CHANGE_ME"
