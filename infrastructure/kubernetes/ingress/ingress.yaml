apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetro-ingress
  namespace: assetro-platform
  labels:
    app.kubernetes.io/name: assetro-ingress
    app.kubernetes.io/part-of: assetro
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    nginx.ingress.kubernetes.io/rate-limit-rps: "50"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.assetro.com
        - admin.assetro.com
        - app.assetro.com
      secretName: assetro-tls-cert
  rules:
    - host: api.assetro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
    - host: admin.assetro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-portal
                port:
                  number: 3000
    - host: app.assetro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: investor-portal
                port:
                  number: 3000
