apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: assetro-platform
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: assetro
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
