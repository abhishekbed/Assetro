# Assetro Platform – Nginx Reverse Proxy Configuration
# Replace all occurrences of "demo.assetro.com" with your actual domain.
# Assumes SSL certificates are managed by Certbot (Let's Encrypt).

# ─────────────────────────────────────────────────────────────────────────────
# Upstream Definitions
# ─────────────────────────────────────────────────────────────────────────────
upstream api_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Investor and issuer are one Next.js app: investor at /, issuer at /issuer.
upstream web_platform {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream web_admin {
    server 127.0.0.1:3003;
    keepalive 16;
}

# ─────────────────────────────────────────────────────────────────────────────
# Rate Limiting
# ─────────────────────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ─────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect for all subdomains
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name demo.assetro.com api.demo.assetro.com app.demo.assetro.com
                investor.demo.assetro.com issuer.demo.assetro.com admin.demo.assetro.com;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# API Gateway  →  api.demo.assetro.com
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # Upload size (KYC documents)
    client_max_body_size 20M;

    # Rate-limit auth endpoints more aggressively
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Platform (investor + issuer)  →  app.demo.assetro.com
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    # Cache Next.js static assets
    location /_next/static/ {
        proxy_pass       http://web_platform;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://web_platform;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Legacy hosts  →  301 to the combined app
# ─────────────────────────────────────────────────────────────────────────────
# issuer.demo/*   → app.demo/issuer/*      investor.demo/* → app.demo/*
server {
    listen 443 ssl http2;
    server_name issuer.demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # /foo on the old issuer host is /issuer/foo on the combined app.
    location / {
        return 301 https://app.demo.assetro.com/issuer$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name investor.demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://app.demo.assetro.com$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Admin Console  →  admin.demo.assetro.com
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;

    # Restrict admin to specific IPs (recommended for demo)
    # allow 1.2.3.4;   # Your office IP
    # deny all;

    location /_next/static/ {
        proxy_pass       http://web_admin;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://web_admin;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Root domain  →  redirect to investor portal
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.assetro.com;

    ssl_certificate     /etc/letsencrypt/live/demo.assetro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.assetro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.demo.assetro.com$request_uri;
}
