version: "3.9"

# Test environment: ephemeral services with no persistent volumes.
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: assetro-test-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: assetro_test
      POSTGRES_PASSWORD: assetro_test_password
      POSTGRES_DB: assetro_platform_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetro_test -d assetro_platform_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - assetro-test-network

  redis:
    image: redis:7-alpine
    container_name: assetro-test-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly no
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - assetro-test-network

networks:
  assetro-test-network:
    driver: bridge
    name: assetro-test-network
