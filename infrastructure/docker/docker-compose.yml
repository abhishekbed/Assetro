version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: assetro-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetro_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-assetro_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetro} -d ${POSTGRES_DB:-assetro_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - assetro-network

  mongodb:
    image: mongo:7
    container_name: assetro-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-assetro}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-assetro_dev_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-assetro_logs}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - assetro-network

  redis:
    image: redis:7-alpine
    container_name: assetro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-assetro_dev_password} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-assetro_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetro-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: assetro-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-assetro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-assetro_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-assetro}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - assetro-network

  localstack:
    profiles: ["aws"]
    image: localstack/localstack:latest
    container_name: assetro-localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - assetro-network

volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  localstack-data:
    driver: local

networks:
  assetro-network:
    driver: bridge
    name: assetro-network
