name: CD - Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: assetro-staging
  NAMESPACE: assetro-platform

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - token-service
          - compliance-service
          - kyc-service
          - payment-service
          - blockchain-service
          - notification-service
          - admin-portal
          - investor-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/assetro/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/assetro/${{ matrix.service }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  deploy:
    name: Deploy to EKS Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # Update image tags in deployments
          SERVICES=(
            api-gateway
            token-service
            compliance-service
            kyc-service
            payment-service
            blockchain-service
            notification-service
            admin-portal
            investor-portal
          )

          for SERVICE in "${SERVICES[@]}"; do
            echo "Deploying ${SERVICE}..."
            kubectl set image deployment/${SERVICE} \
              ${SERVICE}=${{ env.ECR_REGISTRY }}/assetro/${SERVICE}:${{ github.sha }} \
              -n ${{ env.NAMESPACE }} \
              --record || echo "Deployment ${SERVICE} not found, skipping..."
          done

      - name: Wait for rollouts
        run: |
          SERVICES=(api-gateway token-service compliance-service kyc-service payment-service blockchain-service notification-service)
          for SERVICE in "${SERVICES[@]}"; do
            echo "Waiting for ${SERVICE} rollout..."
            kubectl rollout status deployment/${SERVICE} \
              -n ${{ env.NAMESPACE }} \
              --timeout=300s || echo "Rollout for ${SERVICE} timed out or not found."
          done

      - name: Run smoke tests
        run: |
          API_URL=$(kubectl get ingress assetro-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.rules[0].host}')
          echo "Running smoke tests against https://${API_URL}"
          curl -sf "https://${API_URL}/health" || exit 1
          echo "Smoke tests passed."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deployment failed for commit ${{ github.sha }}"
